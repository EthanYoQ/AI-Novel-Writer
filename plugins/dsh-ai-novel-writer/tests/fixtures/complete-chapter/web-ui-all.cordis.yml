- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: ''

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: web-server
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: 127.0.0.1
    port: 0

- id: web-ui-all
  name: __DSH_WEB_UI_ALL_ENTRY__

- id: web-ui-ssh
  name: __DSH_WEB_UI_SSH_ENTRY__
  config:
    enabled: true
    announceToAgent: false

- id: web-ui-describe-image
  name: __DSH_WEB_UI_DESCRIBE_ENTRY__

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "process.env.DSH_NOVEL_APPROVAL_POLICY || 'ask'"

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

- id: presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: ai-novel-writer
    roots:
      - path: !!js process.env.DSH_NOVEL_PRESET_ROOT
        trust: user
    includeUserRoot: false

- id: snapshot-backend
  name: __DSH_SNAPSHOT_BACKEND_ENTRY__
