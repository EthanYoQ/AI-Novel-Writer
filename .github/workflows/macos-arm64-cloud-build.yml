name: macOS ARM64 cloud package qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-arm64-cloud-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-qualify:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test

      - name: Build unsigned macOS ARM64 package
        run: pnpm run build:mac:artifacts

      - name: Run mounted-DMG smoke
        run: pnpm run smoke:mac-dmg

      - name: Record verified toolchain
        if: ${{ success() }}
        run: |
          test "$(uname -m)" = 'arm64'
          test "$(pnpm --version)" = '11.11.0'
          test "$(node --version | sed 's/^v//')" = '22.23.1'
          echo "AI_NOVEL_CLOUD_BUILD_PNPM_VERSION=$(pnpm --version)" >> "$GITHUB_ENV"

      - name: Generate reproducibility manifest
        if: ${{ success() }}
        run: node scripts/generate-macos-cloud-build-manifest.mjs

      - name: Upload runtime-verified macOS ARM64 package
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-arm64-cloud-build-runtime-verified
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*/AI小说作家-Mac-*-Installer.dmg
            release/*/AI小说作家-Mac-*-Installer.dmg.sha256
            release/*/SHA256SUMS.txt
            release/*/manifest.json
            release/*/qualification/packaged-vector-smoke.json
            release/*/qualification/packaged-official-homepage-smoke.json
            release/*/qualification/macos-dmg-smoke.json
