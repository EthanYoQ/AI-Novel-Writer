name: macOS ARM64 cloud package qualification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full immutable commit SHA to qualify
        required: true
        type: string
      release_tag:
        description: Intended tag; qualification does not create it
        required: true
        type: string
      release_version:
        description: Frozen application version
        required: true
        type: string
      profile_path:
        description: Repository-relative frozen release profile
        required: true
        default: .release/release-profile.json
        type: string

permissions:
  contents: read

concurrency:
  group: macos-arm64-cloud-build-${{ inputs.expected_sha }}-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  package-and-qualify:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Initialize macOS v2 acceptance evidence
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          PROFILE_PATH: ${{ inputs.profile_path }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$PROFILE_PATH" = '.release/release-profile.json'
          git ls-files --error-unmatch -- "$PROFILE_PATH" >/dev/null
          evidence_root="$RUNNER_TEMP/ai-novel-release-evidence-$GITHUB_RUN_ID"
          node scripts/release-evidence-v2.mjs init --platform macos --evidence-root "$evidence_root" --repository "$GITHUB_REPOSITORY" --commit "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --runner-label 'macos-14' --image-os "$ImageOS" --image-version "$ImageVersion" --expected-node-version 22.23.1 --expected-pnpm-version 11.11.0 --workflow-path '.github/workflows/macos-arm64-cloud-build.yml' --workflow-name 'macOS ARM64 cloud package qualification' --actor "$GITHUB_ACTOR" --event "$GITHUB_EVENT_NAME" --dispatch-inputs-json '{}'
          common_root="$RUNNER_TEMP/macos-qualified"
          node .release/scripts/freeze-release-contract.mjs --repository "$GITHUB_REPOSITORY" --expected-sha "$EXPECTED_SHA" --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" --profile "$PROFILE_PATH" --output-root "$common_root" --platform macos --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --workflow '.github/workflows/macos-arm64-cloud-build.yml' --actor "$GITHUB_ACTOR" --event "$GITHUB_EVENT_NAME"
          echo "AI_NOVEL_RELEASE_EVIDENCE_ROOT=$evidence_root" >> "$GITHUB_ENV"
          echo "AI_NOVEL_COMMON_EVIDENCE_ROOT=$common_root" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step install-locked-dependencies -- pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step install-playwright-chromium -- pnpm exec playwright install chromium

      - name: Run renderer browser tests
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step renderer-browser-tests -- pnpm run test:browser

      - name: Build native secure helper for macOS tests
        run: |
          node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step build-native-secure-helper -- bash -lc 'clang -fobjc-arc -framework Foundation electron/security/darwin-safe-file-system.m -o electron/security/darwin-safe-file-system && chmod +x electron/security/darwin-safe-file-system'

      - name: Run test suite
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step test-suite -- pnpm test

      - name: Build unsigned macOS ARM64 package
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step build-macos-arm64-package -- pnpm run build:mac:artifacts

      - name: Run mounted-DMG smoke
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step mounted-dmg-smoke -- pnpm run smoke:mac-dmg

      - name: Remove unpacked macOS build intermediary
        if: ${{ success() }}
        run: |
          set -euo pipefail
          version='${{ inputs.release_version }}'
          rm -rf -- "release/$version/mac-arm64"

      - name: Record verified toolchain
        if: ${{ success() }}
        run: |
          test "$(uname -m)" = 'arm64'
          test "$(pnpm --version)" = '11.11.0'
          test "$(node --version | sed 's/^v//')" = '22.23.1'
          echo "AI_NOVEL_CLOUD_BUILD_PNPM_VERSION=$(pnpm --version)" >> "$GITHUB_ENV"

      - name: Finalize macOS v2 acceptance receipts
        if: ${{ success() }}
        run: |
          set -euo pipefail
          version='${{ inputs.release_version }}'
          node scripts/release-evidence-v2.mjs finalize --platform macos --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --release-root "release/$version"
          raw_hash="$(node --input-type=module -e "import{createHash}from'node:crypto';import{readFileSync}from'node:fs';process.stdout.write(createHash('sha256').update(readFileSync('pnpm-lock.yaml')).digest('hex'))")"
          canonical_hash="$(node --input-type=module -e "import{canonicalPnpmLockfileSha256}from'./scripts/canonical-pnpm-lockfile-hash.mjs';process.stdout.write(canonicalPnpmLockfileSha256('./pnpm-lock.yaml'))")"
          node scripts/release-evidence-v2.mjs verify-bundle --platform macos --bundle-root "release/$version" --expected-commit '${{ inputs.expected_sha }}' --expected-lockfile-sha256 "$canonical_hash" --expected-lockfile-raw-sha256 "$raw_hash" --version "$version" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --expected-workflow-path '.github/workflows/macos-arm64-cloud-build.yml' --expected-workflow-name 'macOS ARM64 cloud package qualification' --expected-actor "$GITHUB_ACTOR" --expected-event "$GITHUB_EVENT_NAME"
          node .release/scripts/finalize-legacy-qualification.mjs --platform macos --legacy-root "release/$version" --output-root "$AI_NOVEL_COMMON_EVIDENCE_ROOT" --profile '${{ inputs.profile_path }}' --expected-sha '${{ inputs.expected_sha }}' --version "$version"

      - name: Upload runtime-verified macOS ARM64 package
        if: ${{ success() }}
        id: upload-qualified
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-macos
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: ${{ runner.temp }}/macos-qualified
