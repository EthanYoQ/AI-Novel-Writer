name: macOS Intel batch diagnostic only
run-name: Batch browser diagnostic only at ${{ inputs.expected_sha }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact diagnostic commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: batch-cloud-diagnostic-${{ inputs.expected_sha }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.11.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Record diagnostic identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
          mkdir -p .runtime/.cache/batch-cloud-diagnostic
          node --input-type=module -e 'import fs from "node:fs";import os from "node:os";fs.writeFileSync(".runtime/.cache/batch-cloud-diagnostic/identity.json",JSON.stringify({diagnosticOnly:true,sourceSha:process.env.EXPECTED_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,node:process.version,platform:process.platform,arch:process.arch,cpus:os.cpus().length,imageOS:process.env.ImageOS,imageVersion:process.env.ImageVersion,ci:process.env.CI},null,2))'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Candidate without three unconsumed captures
        id: candidate
        continue-on-error: true
        env:
          DEBUG: pw:api
        run: |
          set -o pipefail
          pnpm run test:browser src/components/dialogs/__tests__/batch-chapter-completion-mode.browser.tsx 2>&1 | tee .runtime/.cache/batch-cloud-diagnostic/candidate.log
      - name: Original screenshot control on same runner
        id: control
        continue-on-error: true
        env:
          DEBUG: pw:api
        run: |
          set -euo pipefail
          test_file=src/components/dialogs/__tests__/batch-chapter-completion-mode.browser.tsx
          git show a1390730ad2023c61f0823376dfb05bf3916379b:"$test_file" > "$test_file"
          pnpm run test:browser "$test_file" 2>&1 | tee .runtime/.cache/batch-cloud-diagnostic/control.log
      - name: Record both outcomes without promotion
        if: ${{ always() }}
        env:
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          CONTROL_OUTCOME: ${{ steps.control.outcome }}
        run: |
          node --input-type=module -e 'import fs from "node:fs";fs.writeFileSync(".runtime/.cache/batch-cloud-diagnostic/outcomes.json",JSON.stringify({candidate:process.env.CANDIDATE_OUTCOME,control:process.env.CONTROL_OUTCOME,order:["candidate","control"],diagnosticOnly:true},null,2))'
          test "$CANDIDATE_OUTCOME" = success
      - name: Upload diagnostic-only evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-only-batch-browser-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            .runtime/.cache/batch-cloud-diagnostic
            .runtime/.cache/overlength-implementation
            src/components/dialogs/__tests__/__screenshots__
