name: macOS Intel x64 timeout diagnostic (70e1c3d8)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Fixed source commit for the one-off serial test diagnostic
        required: true
        default: 70e1c3d893e0f6f0aff76b2c03debecd0513231e
        type: string

permissions:
  contents: read

concurrency:
  group: thread10-x64-diagnostic-70e1c3d8
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out fixed diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 70e1c3d893e0f6f0aff76b2c03debecd0513231e
          fetch-depth: 0
          persist-credentials: false

      - name: Verify fixed source identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = '70e1c3d893e0f6f0aff76b2c03debecd0513231e'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Record diagnostic runtime
        run: |
          set -euo pipefail
          node -e "const os = require('node:os'); console.log(JSON.stringify({ availableParallelism: os.availableParallelism(), cpus: os.cpus().length, node: process.version, platform: process.platform, arch: process.arch }, null, 2)); if (process.platform !== 'darwin' || process.arch !== 'x64' || process.version !== 'v22.23.1') throw new Error('Unexpected diagnostic runtime')"
          test "$(pnpm --version)" = '11.11.0'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native secure helper for macOS tests
        run: |
          set -euo pipefail
          clang -fobjc-arc -framework Foundation electron/security/darwin-safe-file-system.m -o electron/security/darwin-safe-file-system
          chmod +x electron/security/darwin-safe-file-system

      - name: Resolve macOS test temp directory
        run: |
          node -e "const fs = require('node:fs'); const os = require('node:os'); const original = os.tmpdir(); const physical = fs.realpathSync.native(original); fs.appendFileSync(process.env.GITHUB_ENV, 'TMPDIR=' + physical + '\n'); console.log('tempAlias=' + (physical !== original))"

      - name: Run four test files serially with unchanged default timeout
        run: |
          set -euxo pipefail
          pnpm exec vitest run \
            scripts/__tests__/quality-modernization-run.test.mjs \
            electron/services/__tests__/main-generation-owner.test.ts \
            electron/services/__tests__/portable-project-format.test.ts \
            electron/services/__tests__/project-access.test.ts \
            --maxWorkers=1 --reporter=verbose
