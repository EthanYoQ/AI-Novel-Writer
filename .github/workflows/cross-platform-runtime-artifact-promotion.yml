name: Promote verified Windows and macOS artifacts

on:
  workflow_dispatch:
    inputs:
      windows_qualification_run_id:
        description: Successful Windows cloud qualification run ID
        required: true
        type: string
      macos_qualification_run_id:
        description: Successful macOS ARM64 cloud qualification run ID
        required: true
        type: string
      expected_sha:
        description: Full commit SHA qualified by both runs
        required: true
        type: string
      tag:
        description: New final release tag (for example v0.5.0)
        required: true
        type: string
      confirmation:
        description: Type PROMOTE_RUNTIME_VERIFIED_CROSS_PLATFORM_RELEASE exactly
        required: true
        type: string

permissions: {}

concurrency:
  group: cross-platform-runtime-artifact-release-promotion
  cancel-in-progress: false

jobs:
  verify-runtime-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      windows_artifact_id: ${{ steps.plan.outputs.windows_artifact_id }}
      macos_artifact_id: ${{ steps.plan.outputs.macos_artifact_id }}
    steps:
      - name: Require dispatch from the default branch
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"

      - name: Check out trusted promotion code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: promotion-source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1

      - name: Verify qualification runs and select immutable artifacts
        id: plan
        working-directory: promotion-source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/promote-cross-platform-runtime-artifacts.mjs plan
          --repository "$GITHUB_REPOSITORY"
          --windows-qualification-run-id "${{ inputs.windows_qualification_run_id }}"
          --macos-qualification-run-id "${{ inputs.macos_qualification_run_id }}"
          --expected-sha "${{ inputs.expected_sha }}"
          --tag "${{ inputs.tag }}"
          --confirmation "${{ inputs.confirmation }}"
          --output ../qualification-source-plan.json

      - name: Check out qualified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          path: qualified-source
          persist-credentials: false

      - name: Download selected Windows qualification artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.plan.outputs.windows_artifact_id }}
          path: windows-qualification-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.windows_qualification_run_id }}

      - name: Download selected macOS qualification artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.plan.outputs.macos_artifact_id }}
          path: macos-qualification-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.macos_qualification_run_id }}

      - name: Verify both artifacts and stage one release inventory
        working-directory: promotion-source
        run: >-
          node scripts/promote-cross-platform-runtime-artifacts.mjs verify
          --windows-artifact-root ../windows-qualification-artifact
          --macos-artifact-root ../macos-qualification-artifact
          --qualified-source ../qualified-source
          --plan ../qualification-source-plan.json
          --output ../promotion-ready

      - name: Preserve same-run verified promotion package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-platform-release-promotion-ready-${{ github.run_id }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: promotion-ready/

  publish-final-release:
    needs: verify-runtime-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
    steps:
      - name: Check out trusted promotion code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: promotion-source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1

      - name: Download this run's verified promotion package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cross-platform-release-promotion-ready-${{ github.run_id }}
          path: promotion-ready

      - name: Publish one formal cross-platform Release
        id: publish
        working-directory: promotion-source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/promote-cross-platform-runtime-artifacts.mjs publish
          --ready-root ../promotion-ready
