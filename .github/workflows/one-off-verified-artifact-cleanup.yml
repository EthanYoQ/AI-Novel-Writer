name: One-off verified artifact cleanup v1.0.0

on:
  push:
    branches: [chore/release-artifact-retention-20260907]
    paths: [.github/workflows/one-off-verified-artifact-cleanup.yml]

permissions: {}

concurrency:
  group: promote-qualified-desktop-v1.0.0
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout reviewed retention code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up the production verifier runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'

      - name: Run retention safety tests without building the application
        run: node --test .release/scripts/release-artifact-retention.test.mjs

      - name: Verify published bytes and remove only the approved transfer artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFile } from 'node:fs/promises';
          const repository = 'EthanYoQ/AI-Novel-Writer';
          assert.equal(process.env.GITHUB_REPOSITORY, repository);
          const sha = '15e31bb88c462596f28d8e2a46088ecac2da0548';
          const runId = 34055206286;
          const artifactId = 9995755733;
          const releaseId = 383694108;
          const artifactDigest = 'sha256:4d0e6e64f1e16ce747286480339da5823f2f7cadb8b36aec960ec75cee470469';
          const size = 675991689;
          const workflow = '.github/workflows/cross-platform-runtime-artifact-promotion.yml';
          const retained = [9995709153, 9995569749, 9995677278];
          const expectedAssets = [
            ['ai-novel-writer-mac-arm64-1.0.0-installer.dmg', 234913794, '1f58e1ec4a480f0b914fd6ff6559e06a9962a0e3f39d32ac447e4f3aecc7b657'],
            ['ai-novel-writer-mac-arm64-1.0.0-installer.dmg.sha256', 112, '2e13d8b33ffb7a3d1d900f7a8cc1bf522d71595bac3950ac19d7058958dc0686'],
            ['ai-novel-writer-mac-x64-1.0.0-installer.dmg', 246893633, '7026ab0764e73a4fe0b01e0c9d95f91fa30282a48678cc854c941c7e79ff2f23'],
            ['ai-novel-writer-mac-x64-1.0.0-installer.dmg.sha256', 110, 'e25ec65cc07267ad2919088ea0012f3d8b255aee1af20749e5a5ac889ee739ec'],
            ['ai-novel-writer-setup-1.0.0.exe', 195139528, 'c7392e16ba07011344b079090e13a135a01acfe84eb22d1a7b7d9bb5573b79fe'],
            ['ai-novel-writer-setup-1.0.0.exe.blockmap', 204050, '59d3e74222e19e079c40dbd65d70e17ca3acb02085f81d7d9ae65c5d0d3d9722'],
            ['latest.yml', 359, '5438db06d5eefded5f75cf8101f18abf8556216853acca7be26aeb75f507fe76'],
          ];
          async function api(path, method = 'GET', allowMissing = false) {
            assert.ok(path.startsWith('/') && !path.startsWith('//'));
            assert.ok(method === 'GET' || (method === 'DELETE' && path === `/actions/artifacts/${artifactId}`));
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, {
              method, redirect: 'error', signal: AbortSignal.timeout(30000),
              headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
            });
            if (allowMissing && response.status === 404) return null;
            if (!response.ok) throw new Error(`${method} ${path}: HTTP ${response.status}`);
            if (method === 'DELETE') assert.equal(response.status, 204);
            return response.status === 204 ? null : response.json();
          }
          async function verifyRelease() {
            const release = await api(`/releases/${releaseId}`);
            assert.equal(release.id, releaseId);
            assert.equal(release.tag_name, 'v1.0.0');
            assert.equal(release.draft, false);
            assert.equal(release.prerelease, false);
            assert.equal((await api('/commits/v1.0.0')).sha, sha);
            assert.deepEqual(release.assets.map(a => a.name).sort(), expectedAssets.map(a => a[0]).sort());
            for (const [name, bytes, digest] of expectedAssets) {
              const asset = release.assets.find(a => a.name === name);
              assert.equal(asset.state, 'uploaded');
              assert.equal(asset.size, bytes);
              assert.equal(asset.digest, `sha256:${digest}`);
            }
            return release;
          }
          const promotion = await api(`/actions/runs/${runId}`);
          assert.equal(promotion.run_attempt, 1);
          assert.equal(promotion.status, 'completed');
          assert.equal(promotion.conclusion, 'success');
          assert.equal(promotion.head_sha, sha);
          assert.equal(promotion.path.split('@')[0], workflow);
          for (const status of ['in_progress', 'queued', 'waiting', 'pending', 'requested']) {
            for (let page = 1; ; page++) {
              const { workflow_runs: runs } = await api(`/actions/runs?status=${status}&per_page=100&page=${page}`);
              assert.ok(Array.isArray(runs));
              assert.ok(!runs.some(run => String(run.path).split('@')[0] === workflow && run.status !== 'completed'), 'another promotion is active; do not clean');
              if (runs.length < 100) break;
            }
          }
          const before = await verifyRelease();
          const qualificationBefore = [];
          for (const id of retained) qualificationBefore.push(await api(`/actions/artifacts/${id}`));
          const artifact = await api(`/actions/artifacts/${artifactId}`, 'GET', true);
          if (artifact) {
            assert.equal(artifact.id, artifactId);
            assert.equal(artifact.name, `verified-desktop-release-${sha}`);
            assert.equal(artifact.digest, artifactDigest);
            assert.equal(artifact.size_in_bytes, size);
            assert.equal(artifact.workflow_run.id, runId);
            assert.equal(artifact.workflow_run.head_sha, sha);
            console.log(JSON.stringify({ preDeletion: true, artifact, releaseId, sourceSha: sha, provenanceCommentId: 5563050744 }));
            await api(`/actions/artifacts/${artifactId}`, 'DELETE');
          }
          assert.equal(await api(`/actions/artifacts/${artifactId}`, 'GET', true), null, 'deletion was not confirmed');
          const after = await verifyRelease();
          assert.equal(after.body, before.body);
          assert.deepEqual(after.assets.map(a => a.id), before.assets.map(a => a.id));
          for (const saved of qualificationBefore) {
            const current = await api(`/actions/artifacts/${saved.id}`);
            assert.equal(current.digest, saved.digest);
            assert.equal(current.size_in_bytes, saved.size_in_bytes);
          }
          const result = { status: artifact ? 'deleted-and-confirmed' : 'already-absent', artifactId,
            deletedBytes: artifact ? size : 0, releaseUnchanged: true, retainedQualificationIds: retained,
            provenanceCommentId: 5563050744 };
          console.log(JSON.stringify(result));
          await appendFile(process.env.GITHUB_STEP_SUMMARY, `## Approved single-artifact cleanup\n\n\`\`\`json\n${JSON.stringify(result, null, 2)}\n\`\`\`\n`);
          NODE
