name: One-off documentation contract repair
on:
  push:
    branches: [fix/ci-doc-contract-20260907]
    paths: [.github/workflows/one-off-doc-contract-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Replace only stale documentation identifiers, preserving all runtime assertions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.parse,difflib
          repo='EthanYoQ/AI-Novel-Writer'
          branch='fix/ci-doc-contract-20260907'
          path='plugins/dsh-ai-novel-writer/tests/qualification.spec.ts'
          expected='c681cbc69dcf486fc800ddcf02c1217efeb0fba5'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          def api(suffix,method='GET',data=None):
              assert method=='GET' or (method=='PUT' and suffix=='/contents/'+path)
              body=json.dumps(data).encode() if data is not None else None
              req=urllib.request.Request('https://api.github.com/repos/'+repo+suffix,data=body,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          ref='?ref='+urllib.parse.quote(branch,safe='')
          original=api('/contents/'+path+ref)
          assert original['sha']==expected,'source test changed; do not overwrite'
          source=base64.b64decode(original['content']).decode()
          readme=base64.b64decode(api('/contents/plugins/dsh-ai-novel-writer/README.md'+ref)['content']).decode()
          replacements={
            "    expect(section).toContain('dsh-ai-novel-qualification-128')": "    expect(section).toContain('docs/v2-development-gates.md')\n    expect(section).toContain('task-owned `.runtime/.cache/` directory')\n    expect(section).toContain('`.vibe-owner.json` ownership and expiry')",
            "    expect(section).toContain('gpt-5.6-terra manual qualification')": "    expect(section).toContain('The keyless snapshot does not replace manual qualification with a configured online model')",
            "    const start = readme.indexOf('## Release qualification')\n    const section = readme.slice(start)": "    const start = readme.indexOf('## Release qualification')\n    expect(start).toBeGreaterThanOrEqual(0)\n    const section = readme.slice(start)",
          }
          updated=source
          for old,new in replacements.items():
              assert updated.count(old)==1,'expected unique original assertion'
              updated=updated.replace(old,new,1)
          for phrase in ['docs/v2-development-gates.md','task-owned `.runtime/.cache/` directory','`.vibe-owner.json` ownership and expiry','The keyless snapshot does not replace manual qualification with a configured online model']:
              assert phrase in readme
          for phrase in ["expect(section).toContain('novel_read')","expect(section).toContain('novel_propose_change')","expect(section).toContain('A browser skipped result is not qualified')"]:
              assert phrase in updated
          assert updated.count("  it(")==source.count("  it("),'no test may be removed'
          print(''.join(difflib.unified_diff(source.splitlines(True),updated.splitlines(True),fromfile=path,tofile=path)))
          result=api('/contents/'+path,'PUT',{'message':'test: assert durable qualification documentation instead of expired run and model labels','branch':branch,'sha':expected,'content':base64.b64encode(updated.encode()).decode()})
          assert base64.b64decode(api('/contents/'+path+ref)['content']).decode()==updated
          print('REPAIR_COMMIT '+result['commit']['sha'])
          PY
