name: 功能建议
description: 提议一项明确的用户问题或产品改进
title: "[Feature] "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，再描述期望变化。一个 Issue 只提交一项需求。

        **这是公开页面。禁止上传 API Key、Token、完整小说、未公开创作资料、私人本机路径或个人信息。** 示例请使用虚构、脱敏内容。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues，没有找到相同建议。
          required: true
        - label: 我已移除凭据、完整小说、私人路径和其他敏感信息。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里困难、容易出错或无法完成？请描述问题，不需要判断内部实现。
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁会在什么操作阶段使用它？请给出一个简短、脱敏的例子。
    validations:
      required: true

  - type: textarea
    id: desired-change
    attributes:
      label: 期望的变化
      description: 希望用户可以做什么，完成后应看到什么结果？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法
      description: 已有替代操作、临时办法或相近功能是什么？没有时填写“无”。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围与限制
      description: 哪些行为必须保留，哪些内容明确不在本建议范围内？不确定时填写“未知”。
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: 其他补充
      description: 可添加脱敏截图、草图或相关链接。
